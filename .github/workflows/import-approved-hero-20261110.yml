name: Import approved Raphael hero (one-time)

on:
  push:
    branches: [main]
    paths:
      - assets/hero/approved-hero-upload.json

permissions:
  contents: write

concurrency:
  group: import-approved-raphael-hero
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'RaphaelAI-OpenLab/awesome-gpt-image-2-6'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image decoder
        run: python3 -m pip install --quiet --disable-pip-version-check 'Pillow==11.3.0'
      - name: Validate and import approved banner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path
          from PIL import Image

          upload = Path('assets/hero/approved-hero-upload.json')
          manifest = json.loads(upload.read_text())
          chunks = manifest['chunks']
          assert len(chunks) == 9, 'Unexpected upload chunk count'
          expected = 'ef3b918629ba657e2aa42807c1d4b0a0ffb3494a3711f3d435e390d69414ea55'
          assert manifest['sha256'] == expected, 'Unexpected banner checksum'
          parts = []
          for sha in chunks:
              assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Invalid blob SHA'
              req = urllib.request.Request(
                  'https://api.github.com/repos/RaphaelAI-OpenLab/awesome-gpt-image-2-6/git/blobs/' + sha,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              assert payload['sha'] == sha and payload['encoding'] == 'base64'
              part = base64.b64decode(payload['content']).decode('ascii')
              assert 0 < len(part) <= 8000
              parts.append(part)
          data = base64.b64decode(''.join(parts), validate=True)
          assert hashlib.sha256(data).hexdigest() == expected, 'Banner upload checksum mismatch'
          image = Image.open(io.BytesIO(data)).convert('RGB')
          assert image.size == (1672, 941), 'Unexpected banner dimensions'
          target = Path('assets/hero/raphael-gpt-image-2-6-hero-v1.png')
          assert target.is_file(), 'Existing shared README hero is missing'
          image.save(target, format='PNG', optimize=True)
          Image.open(target).verify()
          png = target.read_bytes()
          git_sha = hashlib.sha1(('blob ' + str(len(png)) + '\0').encode() + png).hexdigest()
          print('Verified source SHA256:', expected)
          print('Updated shared README hero:', target)
          print('PNG bytes:', len(png), 'dimensions:', image.size)
          print('PNG Git blob SHA:', git_sha)
          print('Pixel SHA256:', hashlib.sha256(image.tobytes()).hexdigest())
          readmes = list(Path('.').glob('README*.md'))
          shared = [p.name for p in readmes if str(target) in p.read_text()]
          print('README files using this hero:', len(shared), ', '.join(shared))
          upload.unlink()
          PY
      - name: Commit shared hero replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/hero/raphael-gpt-image-2-6-hero-v1.png assets/hero/approved-hero-upload.json
          git commit -m 'design: replace shared hero with approved brown-gold Raphael banner'
          git push origin HEAD:main
          git rev-parse HEAD
